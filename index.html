<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graduation Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Dancing+Script:wght@600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pink-soft: #FADADD;
            --pink-main: #F4B6C2;
            --pink-deep: #E89BB0;
            --cream: #FFF8F0;
            --cream-2: #FDF6EC;
            --gold-rose: #D4A373;
            --text-dark: #5c4a4f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #FFF0F5 0%, var(--cream) 100%);
            min-height: 100vh; display: flex;
            justify-content: center; align-items: center;
            font-family: 'Be Vietnam Pro', sans-serif;
            overflow: hidden; color: var(--text-dark);
            perspective: 1200px;
        }

        /* Particles */
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .particle { position: absolute; background: rgba(255, 255, 255, 0.8); border-radius: 50%; animation: float-up linear infinite; }
        @keyframes float-up {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        .audio-btn {
            position: fixed; top: 20px; right: 20px;
            background: var(--cream); border: 2px solid var(--pink-main);
            border-radius: 50%; width: 40px; height: 40px;
            cursor: pointer; z-index: 100;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; box-shadow: 0 4px 10px rgba(232,155,176,0.2); transition: all 0.3s;
        }
        .audio-btn:hover { transform: scale(1.1); }

        .scene { position: relative; width: 90vw; max-width: 420px; height: 280px; transform-style: preserve-3d; transition: transform 0.1s; z-index: 10; }
        .world { position: absolute; width: 100%; height: 100%; transform-style: preserve-3d; }

        /* === ENVELOPE === */
        .env-part { position: absolute; width: 100%; height: 100%; border-radius: 4px; transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .env-back { background: var(--cream-2); transform: translateZ(-2px); box-shadow: 0 20px 60px rgba(232,155,176,0.25); }
        .env-front {
            background: var(--cream); transform: translateZ(5px);
            clip-path: polygon(0 100%, 0 0, 50% 55%, 100% 0, 100% 100%);
            border: 1px solid rgba(244, 182, 194, 0.3);
        }
        .env-flap {
            background: var(--pink-soft); height: 65%;
            transform-origin: top; transform: translateZ(6px) rotateX(0deg);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            display: flex; justify-content: center; align-items: flex-end;
            padding-bottom: 20px; cursor: pointer;
        }
        .seal {
            width: 45px; height: 45px; background: var(--pink-deep);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(232, 155, 176, 0.5), inset 0 0 5px rgba(0,0,0,0.2);
            position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); z-index: 10; transition: transform 0.3s;
        }
        .env-flap:hover .seal { transform: translateX(-50%) scale(1.05); }

        .hint {
            position: absolute; bottom: -40px; left: 0; width: 100%; text-align: center;
            font-family: 'Playfair Display', serif; font-style: italic; color: var(--pink-deep);
            animation: pulse 1.5s infinite; pointer-events: none; transition: opacity 0.5s;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.6; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }

        /* === BI-FOLD CARD === */
        .card-wrapper {
            position: absolute;
            width: 90%; height: 92%; 
            left: 50%; bottom: 3%;
            transform: translateX(-50%) translateZ(1px);
            transform-style: preserve-3d;
            transition: all 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        
        .card-bifold {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-cover {
            position: absolute; width: 100%; height: 100%;
            transform-origin: top; 
            transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }

        .card-base { position: absolute; width: 100%; height: 100%; z-index: 1; }

        .card-face {
            position: absolute; width: 100%; height: 100%; 
            background-color: var(--cream);
            border-radius: 8px; backface-visibility: hidden;
            box-shadow: 0 10px 30px rgba(232,155,176,0.15);
            display: flex; flex-direction: column; padding: 12px; overflow: hidden;
        }
        
        /* Cập nhật Background Hình Ảnh cho các mặt thiệp */
        .card-bg {
             background-image: url('https://i.ibb.co/L5Q2YgX/image-d06940.png'); /* Link ảnh bạn cung cấp */
             background-size: cover;
             background-position: center;
             background-repeat: no-repeat;
        }

        .card-face::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(to bottom right, rgba(255,255,255,0) 40%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 60%);
            transform: rotate(30deg); pointer-events: none;
        }

        .card-front { transform: translateZ(1px); } 
        .card-inside-top { transform: rotateX(180deg) translateZ(1px); } 
        .card-inside-bottom { transform: translateZ(0); } 

        .card-border {
            position: relative; width: 100%; height: 100%; border: 2px solid transparent; border-radius: 6px;
            /* Xóa viền gradient cũ vì đã dùng hình ảnh nền */
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 15px; text-align: center;
            background-color: rgba(255, 248, 240, 0.85); /* Tạo lớp mờ để dễ đọc chữ trên nền ảnh */
        }
        
        /* Mặt ngoài có thể trong suốt hơn để thấy rõ nền */
        .card-front .card-border {
            background-color: transparent;
            justify-content: flex-end; /* Đẩy nội dung xuống dưới */
            padding-bottom: 30px;
        }
        
        /* Mặt trong cần nền trắng mờ để đọc rõ chữ */
        .card-inside-bottom .card-border,
        .card-inside-top .card-border {
             background-color: rgba(255, 253, 248, 0.8);
        }

        .decor-top { width: 45px; margin-bottom: 10px; }
        .title { font-family: 'Playfair Display', serif; font-size: clamp(1.1rem, 4vw, 1.6rem); color: var(--gold-rose); margin-bottom: 5px; text-shadow: 1px 1px 3px rgba(255,255,255,0.8); }
        .subtitle { font-family: 'Dancing Script', cursive; font-size: clamp(1rem, 3.5vw, 1.3rem); color: var(--pink-deep); margin-bottom: 15px; text-shadow: 1px 1px 2px rgba(255,255,255,0.8); }
        .hint-open { font-size: 0.85rem; color: var(--pink-deep); font-style: italic; margin-top: 15px; animation: pulse 1.5s infinite; background-color: rgba(255,255,255,0.7); padding: 5px 10px; border-radius: 15px;}
        
        .info-block { font-size: clamp(0.8rem, 2.5vw, 0.95rem); line-height: 1.8; width: 100%; font-weight: 500; }
        .info-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .message { font-size: clamp(0.8rem, 2.5vw, 0.9rem); line-height: 1.6; margin-bottom: 15px; font-weight: 500; }
        .message-eng { font-style: italic; opacity: 0.8; margin-top: 5px; }
        
        /* Xóa SVG trang trí cũ vì ảnh nền đã có rồi */
        .flower-corner { display: none; }

        .rsvp-btn {
            background: var(--pink-soft); color: var(--text-dark); border: 1px solid var(--gold-rose);
            padding: 8px 20px; border-radius: 20px; font-family: 'Be Vietnam Pro', sans-serif; font-weight: 500;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(244, 182, 194, 0.4);
            margin-bottom: 15px; position: relative; z-index: 20; pointer-events: none; 
        }
        .is-open .rsvp-btn { pointer-events: auto; } 
        .rsvp-btn:hover { transform: scale(1.05); background: var(--pink-main); color: white; box-shadow: 0 0 15px var(--gold-rose); }
        
        .signature { font-family: 'Dancing Script', cursive; font-size: 1.2rem; color: var(--pink-deep); line-height: 1.2;}
        .sign-name { font-size: 1.6rem; color: var(--gold-rose); margin-top: 0px; }

        /* === ANIMATION STATES === */
        .is-opening .env-flap { transform: translateZ(6px) rotateX(180deg); z-index: 1;}
        .is-opening .hint { opacity: 0; }
        
        .is-sliding .card-wrapper { transform: translate(-50%, -115%) translateZ(1px); }
        
        .is-showing .env-part { transform: translateY(150px) translateZ(-50px); opacity: 0; }
        .is-showing .card-wrapper { bottom: auto; top: 50%; transform: translate(-50%, -50%) translateZ(80px) scale(1.1); }
        
        .is-open .card-cover { transform: rotateX(180deg); }
        .is-open .card-bifold { transform: translateY(50%); }
        .is-open .hint-open { display: none; }

        .petal { position: fixed; top: -20px; width: 15px; height: 15px; background: var(--pink-soft); border-radius: 50% 0 50% 50%; pointer-events: none; z-index: 99; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }

        @supports not (transform-style: preserve-3d) {
            .scene, .world, .card-wrapper, .card-bifold { transform: none !important; transition: none !important; }
            .env-flap { display: none; } .card-wrapper { bottom: 20px; z-index: 100; }
        }
    </style>
</head>
<body>
    <button class="audio-btn" id="audioBtn" title="Play/Pause Music">🎵</button>
    <audio id="bgMusic" loop><source src="https://assets.mixkit.co/music/preview/mixkit-beautiful-dream-493.mp3" type="audio/mpeg"></audio>
    <div class="particles" id="particles"></div>

    <div class="scene" id="scene">
        <div class="world" id="world">
            <div class="env-part env-back"></div>

            <!-- BI-FOLD CARD -->
            <div class="card-wrapper" id="cardWrapper">
                <div class="card-bifold" id="card">
                    
                    <!-- BOTTOM HALF -->
                    <div class="card-base">
                        <div class="card-face card-bg card-inside-bottom">
                            <div class="card-border">
                                <div class="message">
                                    <p>Please join me in celebrating</p>
                                    <p>my graduation ceremony.</p>
                                    <p class="message-eng">Your presence is the greatest gift!</p>
                                </div>
                                <button class="rsvp-btn" id="rsvpBtn">RSVP</button>
                                <div class="signature">
                                    <p>With love,</p>
                                    <p class="sign-name">Châu Khánh Vy aka Tuti</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- TOP HALF (Cover) -->
                    <div class="card-cover">
                        <!-- Inside of the Cover -->
                        <div class="card-face card-bg card-inside-top">
                            <div class="card-border">
                                <div class="info-block">
                                    <div class="info-row"><span>📅</span> Sunday, December 6th, 2026</div>
                                    <div class="info-row" style="margin: 15px 0;"><span>📍</span> BUV Campus, Ecopark</div>
                                    <div class="info-row"><span>📸</span> Picture time: 11:30 – 14:00</div>
                                </div>
                            </div>
                        </div>

                        <!-- Front of the Cover -->
                        <div class="card-face card-bg card-front">
                            <div class="card-border">
                                <h1 class="title">GRADUATION<br>INVITATION</h1>
                                <p class="subtitle">Class of 2026</p>
                                <div class="hint-open">Tap to open 💌</div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="env-part env-front"></div>
            <div class="env-part env-flap" id="flap">
                <div class="seal">
                    <!-- Flower Icon replacing the Heart -->
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="white">
                        <path d="M12,2C10.9,2 10,2.9 10,4C10,4.2 10,4.4 10.1,4.5C8.4,4.2 6.7,4.8 5.6,6.1C4.4,7.4 4.1,9.2 4.6,10.9C4.5,10.9 4.3,10.9 4.2,10.9C3,10.9 2,11.9 2,13.1C2,14.3 3,15.3 4.2,15.3C4.8,15.3 5.4,15 5.8,14.6C6.3,16.2 7.6,17.5 9.2,17.9C9.1,18.4 9,18.8 9,19.3C9,20.5 10,21.5 11.2,21.5C12.4,21.5 13.4,20.5 13.4,19.3C13.4,18.8 13.3,18.4 13.2,17.9C14.8,17.5 16.1,16.2 16.6,14.6C17,15 17.6,15.3 18.2,15.3C19.4,15.3 20.4,14.3 20.4,13.1C20.4,11.9 19.4,10.9 18.2,10.9C18.1,10.9 17.9,10.9 17.8,10.9C18.3,9.2 18,7.4 16.8,6.1C15.7,4.8 14,4.2 12.3,4.5C12.4,4.4 12.4,4.2 12.4,4C12.4,2.9 11.5,2 10.4,2M12,9.3C13.5,9.3 14.7,10.5 14.7,12C14.7,13.5 13.5,14.7 12,14.7C10.5,14.7 9.3,13.5 9.3,12C9.3,10.5 10.5,9.3 12,9.3Z" />
                    </svg>
                </div>
            </div>
        </div>
        <div class="hint" id="hint">Tap to open 💌</div>
    </div>

    <script>
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            let p = document.createElement('div');
            p.className = 'particle';
            let size = Math.random() * 4 + 2;
            p.style.width = size + 'px'; p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (Math.random() * 10 + 5) + 's';
            p.style.animationDelay = (Math.random() * 5) + 's';
            particlesContainer.appendChild(p);
        }

        const world = document.getElementById('world');
        const flap = document.getElementById('flap');
        const cardWrapper = document.getElementById('cardWrapper');
        const rsvpBtn = document.getElementById('rsvpBtn');
        let state = 0; 

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playWhoosh() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.5);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.1);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        function shootConfetti() {
            const colors = ['#FADADD', '#F4B6C2', '#FFF8F0', '#D4A373'];
            for(let i = 0; i < 60; i++) {
                let petal = document.createElement('div');
                petal.className = 'petal'; petal.style.left = Math.random() * 100 + 'vw';
                petal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                petal.style.animationDuration = (Math.random() * 3 + 2.5) + 's';
                petal.style.animationDelay = (Math.random() * 0.5) + 's';
                petal.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(petal);
                setTimeout(() => petal.remove(), 6000);
            }
        }

        flap.addEventListener('click', (e) => {
            e.stopPropagation();
            if (state !== 0) return;
            state = 1; playWhoosh();
            world.classList.add('is-opening');
            
            setTimeout(() => { world.classList.add('is-sliding'); }, 600);
            setTimeout(() => { world.classList.add('is-showing'); state = 2; }, 1600);
            setTimeout(() => { shootConfetti(); }, 2200);
        });

        cardWrapper.addEventListener('click', () => {
            if (state < 2) return; 
            cardWrapper.classList.toggle('is-open');
        });

        rsvpBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            alert('Thank you for your RSVP! 💕');
        });

        const audioBtn = document.getElementById('audioBtn');
        const bgMusic = document.getElementById('bgMusic');
        let isPlaying = false;
        audioBtn.addEventListener('click', () => {
            if(isPlaying) {
                bgMusic.pause(); audioBtn.innerHTML = '🎵'; audioBtn.style.borderColor = 'var(--pink-main)';
            } else {
                bgMusic.play().catch(e => console.log("Browser blocked Autoplay"));
                audioBtn.innerHTML = '🔊'; audioBtn.style.borderColor = 'var(--gold-rose)';
            }
            isPlaying = !isPlaying;
        });

        if (window.matchMedia("(hover: hover)").matches) {
            const scene = document.getElementById('scene');
            window.addEventListener('mousemove', (e) => {
                if (state >= 2) return; 
                let xAxis = (window.innerWidth / 2 - e.pageX) / 25;
                let yAxis = (window.innerHeight / 2 - e.pageY) / 25;
                scene.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
            window.addEventListener('mouseleave', () => {
                if (state < 2) scene.style.transform = `rotateY(0deg) rotateX(0deg)`;
            });
        }
    </script>
</body>
</html>
